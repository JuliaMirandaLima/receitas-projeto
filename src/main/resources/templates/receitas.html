<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Minhas Receitas</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #fff8f0;
            margin: 0;
        }

        header {
            background-color: #e67e22;
            color: white;
            text-align: center;
            padding: 25px;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .receita {
            background-color: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 15px;
            box-shadow: 0 2px 10px #ccc;
        }

        .acoes a {
            margin-right: 15px;
            color: #e67e22;
            text-decoration: none;
        }

        .nova {
            display: inline-block;
            margin-bottom: 25px;
            padding: 12px 18px;
            background-color: #e67e22;
            color: white;
            border-radius: 8px;
            text-decoration: none;
        }

        .voltar {
            color: #e67e22;
            text-decoration: none;
        }

    </style>
</head>

<body>

<header>

    <h1>📖 Minhas Receitas</h1>

</header>

<main>

    <a class="nova" href="/receitas/nova">
        ➕ Nova receita
    </a>

    <div th:if="${#lists.isEmpty(receitas)}">

        <div class="receita">

            <h2>Nenhuma receita cadastrada</h2>

            <p>
                Cadastre sua primeira receita para começar seu caderno.
            </p>

        </div>

    </div>

    <div
        class="receita"
        th:each="receita : ${receitas}">

        <h2 th:text="${receita.nome}"></h2>

        <p>
            <strong>Categoria:</strong>
            <span th:text="${receita.categoria}"></span>
        </p>

        <p>
            <strong>Origem:</strong>
            <span th:text="${receita.origem}"></span>
        </p>

        <p>
            <strong>Ingredientes:</strong>
        </p>

        <p th:text="${receita.ingredientes}"></p>

        <p>
            <strong>Modo de preparo:</strong>
        </p>

        <p th:text="${receita.modoPreparo}"></p>

        <div class="acoes">

            <a th:href="@{/receitas/editar/{id}(id=${receita.id})}">
                ✏️ Editar
            </a>

            <a
                th:href="@{/receitas/excluir/{id}(id=${receita.id})}"
                onclick="return confirm('Deseja realmente excluir esta receita?')">

                🗑️ Excluir

            </a>

        </div>

    </div>

    <a class="voltar" href="/">
        ⬅ Voltar para o início
    </a>

</main>

</body>

</html>
