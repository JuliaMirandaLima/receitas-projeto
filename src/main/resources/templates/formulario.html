<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Receita</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #fff8f0;
            margin: 0;
        }

        header {
            background-color: #e67e22;
            color: white;
            text-align: center;
            padding: 25px;
        }

        main {
            max-width: 700px;
            margin: 30px auto;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 2px 10px #ccc;
        }

        label {
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: Arial, sans-serif;
        }

        textarea {
            resize: vertical;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background-color: #e67e22;
            color: white;
            cursor: pointer;
        }

        a {
            color: #e67e22;
            text-decoration: none;
        }

    </style>
</head>

<body>

<header>

    <h1>🍴 Cadastro de Receita</h1>

</header>

<main>

    <form
        action="/receitas/salvar"
        method="post"
        th:object="${receita}">

        <input
            type="hidden"
            th:field="*{id}">

        <label>Nome da receita:</label>

        <input
            type="text"
            th:field="*{nome}"
            placeholder="Ex.: Lasanha"
            required>


        <label>Categoria:</label>

        <input
            type="text"
            th:field="*{categoria}"
            placeholder="Ex.: Massas"
            required>


        <label>Origem:</label>

        <input
            type="text"
            th:field="*{origem}"
            placeholder="Ex.: Italiana">


        <label>URL da imagem:</label>

        <input
            type="text"
            th:field="*{imagemUrl}"
            placeholder="Cole aqui o endereço da imagem">


        <label>Ingredientes:</label>

        <textarea
            th:field="*{ingredientes}"
            rows="6"
            placeholder="Digite os ingredientes...">
        </textarea>


        <label>Modo de preparo:</label>

        <textarea
            th:field="*{modoPreparo}"
            rows="8"
            placeholder="Descreva o modo de preparo...">
        </textarea>


        <button type="submit">
            💾 Salvar receita
        </button>

    </form>

    <br><br>

    <a href="/receitas">
        ⬅ Voltar para minhas receitas
    </a>

</main>

</body>

</html>
